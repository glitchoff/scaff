name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Verify package contents
        shell: bash
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP" >/dev/null
          pkg=$(ls "$RUNNER_TEMP"/*.tgz | head -n1)
          echo "== dist ==" && tar -tzf "$pkg" | grep 'package/dist/main.js'
          echo "== shell wrappers ==" && tar -tzf "$pkg" | grep 'package/shell/scaff.ps1'
          echo "== shell wrappers ==" && tar -tzf "$pkg" | grep 'package/shell/scaff.sh'
