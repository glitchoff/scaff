name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Verify package contents
        shell: bash
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP" >/dev/null
          pkg=$(ls "$RUNNER_TEMP"/*.tgz | head -n1)
          node - "$pkg" <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const file = process.argv[2];
          // Read a gzip tarball and list its entry names (cross-platform; avoids
          // `tar` misreading Windows `D:\` paths as a remote host spec).
          const data = zlib.gunzipSync(fs.readFileSync(file));
          const entries = [];
          let off = 0;
          while (off + 512 <= data.length) {
            const name = data.toString('utf8', off, off + 100).replace(/\0.*$/, '');
            if (!name) break;
            const size = parseInt(data.toString('utf8', off + 124, off + 136).trim(), 8);
            entries.push(name);
            off += 512 + Math.ceil(size / 512) * 512;
          }
          const required = [
            'package/dist/main.js',
            'package/shell/scaff.ps1',
            'package/shell/scaff.sh',
          ];
          const missing = required.filter((f) => !entries.includes(f));
          if (missing.length) {
            console.error('Missing from tarball: ' + missing.join(', '));
            console.error('Entries: ' + entries.join('\n'));
            process.exit(1);
          }
          console.log('tarball OK: ' + required.join(', '));
          NODE
