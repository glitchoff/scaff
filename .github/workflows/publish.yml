name: Publish

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Smoke test the built CLI
        shell: bash
        run: |
          export SCAFF_CONFIG_DIR="$RUNNER_TEMP/scaff-smoke"
          mkdir -p "$SCAFF_CONFIG_DIR/work/demo-app"
          node dist/main.js -zone add hot "$SCAFF_CONFIG_DIR/work"
          node dist/main.js -zone hot hot
          node dist/main.js demo-app | grep -q "demo-app" && echo "path OK"
          node dist/main.js -zone ls | grep -q "hot" && echo "hot OK"
          node dist/main.js -version

      - name: Verify version matches the tag
        shell: bash
        run: |
          pkg_ver=$(node -p "require('./package.json').version")
          tag_ver="${GITHUB_REF_NAME#v}"
          if [ "$pkg_ver" != "$tag_ver" ]; then
            echo "package.json version ($pkg_ver) does not match tag ($tag_ver)" >&2
            exit 1
          fi
          echo "Tag $tag_ver matches package.json"

      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish --provenance
